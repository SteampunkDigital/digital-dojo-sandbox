<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no" />
        <title>Mesh Viewer</title>
        <style>
            * { margin: 0; padding: 0; }
            html, body { width: 100%; height: 100%; overflow: hidden; }
            #canvas { width: 100%; height: 100%; display: block; }
            #loading {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                color: white;
                font-family: sans-serif;
                font-size: 14px;
            }
        </style>
        <script type="importmap">
        {
            "imports": {
                "playcanvas": "https://cdn.jsdelivr.net/npm/playcanvas@2.1.0/build/playcanvas.mjs"
            }
        }
        </script>
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <div id="loading">Loading mesh...</div>

        <script type="module">
            import * as pc from 'playcanvas';

            // Parse URL parameters
            const url = new URL(location.href);
            const contentUrl = url.searchParams.get('content') || './mesh.glb';

            // Rotation parameter: accepts "x,y,z" degrees
            // Default: 90 X (Z-up to Y-up) for SAM3D coordinate system
            const rotationParam = url.searchParams.get('rotation') || '90,0,0';
            const [rotX, rotY, rotZ] = rotationParam.split(',').map(Number);
            console.log(`Rotation: (${rotX}, ${rotY}, ${rotZ})`);

            // Background color
            const bgParam = url.searchParams.get('bg') || '0.1,0.1,0.15';
            const [bgR, bgG, bgB] = bgParam.split(',').map(Number);

            const canvas = document.getElementById('canvas');
            const loadingDiv = document.getElementById('loading');

            // Create PlayCanvas application
            const app = new pc.Application(canvas, {
                mouse: new pc.Mouse(canvas),
                touch: new pc.TouchDevice(canvas),
                graphicsDeviceOptions: {
                    antialias: true,
                    alpha: false,
                    preserveDrawingBuffer: false,
                    preferWebGl2: true
                }
            });

            app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);
            app.setCanvasResolution(pc.RESOLUTION_AUTO);

            // Set background color
            app.scene.ambientLight = new pc.Color(0.3, 0.3, 0.3);

            // Create camera
            const camera = new pc.Entity('camera');
            camera.addComponent('camera', {
                clearColor: new pc.Color(bgR, bgG, bgB),
                fov: 45
            });
            camera.setPosition(0, 1, 3);
            camera.lookAt(0, 0, 0);
            app.root.addChild(camera);

            // Create lights
            const light = new pc.Entity('light');
            light.addComponent('light', {
                type: 'directional',
                color: new pc.Color(1, 1, 1),
                intensity: 1.5
            });
            light.setEulerAngles(45, 135, 0);
            app.root.addChild(light);

            const fillLight = new pc.Entity('fill-light');
            fillLight.addComponent('light', {
                type: 'directional',
                color: new pc.Color(0.5, 0.6, 0.7),
                intensity: 0.5
            });
            fillLight.setEulerAngles(-30, -45, 0);
            app.root.addChild(fillLight);

            // Orbit camera controls
            let distance = 3;
            let pitch = -15;
            let yaw = 45;
            let targetPos = new pc.Vec3(0, 0, 0);
            let isDragging = false;
            let lastX = 0, lastY = 0;

            function updateCamera() {
                const pitchRad = pitch * Math.PI / 180;
                const yawRad = yaw * Math.PI / 180;

                const x = targetPos.x + distance * Math.cos(pitchRad) * Math.sin(yawRad);
                const y = targetPos.y + distance * Math.sin(pitchRad);
                const z = targetPos.z + distance * Math.cos(pitchRad) * Math.cos(yawRad);

                camera.setPosition(x, y, z);
                camera.lookAt(targetPos);
            }

            canvas.addEventListener('mousedown', (e) => {
                isDragging = true;
                lastX = e.clientX;
                lastY = e.clientY;
            });

            canvas.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - lastX;
                const dy = e.clientY - lastY;
                yaw -= dx * 0.5;
                pitch = Math.max(-89, Math.min(89, pitch - dy * 0.5));
                lastX = e.clientX;
                lastY = e.clientY;
                updateCamera();
            });

            canvas.addEventListener('mouseup', () => isDragging = false);
            canvas.addEventListener('mouseleave', () => isDragging = false);

            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                distance = Math.max(0.5, Math.min(20, distance + e.deltaY * 0.01));
                updateCamera();
            });

            // Touch controls
            let lastTouchDist = 0;
            canvas.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    isDragging = true;
                    lastX = e.touches[0].clientX;
                    lastY = e.touches[0].clientY;
                } else if (e.touches.length === 2) {
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    lastTouchDist = Math.sqrt(dx * dx + dy * dy);
                }
            });

            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (e.touches.length === 1 && isDragging) {
                    const dx = e.touches[0].clientX - lastX;
                    const dy = e.touches[0].clientY - lastY;
                    yaw -= dx * 0.5;
                    pitch = Math.max(-89, Math.min(89, pitch - dy * 0.5));
                    lastX = e.touches[0].clientX;
                    lastY = e.touches[0].clientY;
                    updateCamera();
                } else if (e.touches.length === 2) {
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    const touchDist = Math.sqrt(dx * dx + dy * dy);
                    const delta = lastTouchDist - touchDist;
                    distance = Math.max(0.5, Math.min(20, distance + delta * 0.02));
                    lastTouchDist = touchDist;
                    updateCamera();
                }
            });

            canvas.addEventListener('touchend', () => isDragging = false);

            // Load GLB model
            async function loadModel() {
                loadingDiv.textContent = 'Loading mesh...';

                try {
                    const asset = new pc.Asset('model', 'container', { url: contentUrl });

                    app.assets.add(asset);

                    asset.ready(() => {
                        const entity = asset.resource.instantiateRenderEntity();

                        // Apply rotation (Z-up to Y-up conversion)
                        entity.setLocalEulerAngles(rotX, rotY, rotZ);

                        app.root.addChild(entity);

                        // Auto-fit camera to model bounds
                        const meshInstances = entity.findComponents('render').flatMap(r => r.meshInstances);
                        if (meshInstances.length > 0) {
                            const aabb = new pc.BoundingBox();
                            meshInstances.forEach((mi, i) => {
                                if (i === 0) {
                                    aabb.copy(mi.aabb);
                                } else {
                                    aabb.add(mi.aabb);
                                }
                            });

                            targetPos.copy(aabb.center);
                            const maxDim = Math.max(aabb.halfExtents.x, aabb.halfExtents.y, aabb.halfExtents.z) * 2;
                            distance = maxDim * 2.5;
                            updateCamera();
                        }

                        loadingDiv.style.display = 'none';
                        console.log('Model loaded:', contentUrl);
                    });

                    asset.on('error', (err) => {
                        loadingDiv.textContent = 'Error loading mesh: ' + err;
                        console.error('Model load error:', err);
                    });

                    app.assets.load(asset);

                } catch (err) {
                    loadingDiv.textContent = 'Error: ' + err.message;
                    console.error('Load error:', err);
                }
            }

            // Start
            app.start();
            updateCamera();
            loadModel();

            // Handle resize
            window.addEventListener('resize', () => {
                app.resizeCanvas();
            });
        </script>
    </body>
</html>
