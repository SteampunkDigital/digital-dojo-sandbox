<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no" />
        <title>Mesh Viewer</title>
        <style>
            * { margin: 0; padding: 0; }
            html, body { width: 100%; height: 100%; overflow: hidden; }
            #loading {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                color: white;
                font-family: sans-serif;
                font-size: 14px;
                z-index: 10;
            }
            #lighting-control {
                position: absolute;
                top: 10px;
                right: 10px;
                z-index: 20;
                font-family: sans-serif;
                font-size: 13px;
            }
            #lighting-control select {
                background: rgba(30,30,30,0.85);
                color: #eee;
                border: 1px solid #555;
                border-radius: 4px;
                padding: 5px 8px;
                font-size: 13px;
                cursor: pointer;
                outline: none;
            }
            #lighting-control select:hover {
                border-color: #888;
            }
        </style>
        <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
            }
        }
        </script>
    </head>
    <body>
        <div id="loading">Loading mesh...</div>
        <div id="lighting-control">
            <select id="lighting-preset">
                <option value="studio">Studio</option>
                <option value="bright">Bright</option>
                <option value="outdoor">Outdoor</option>
                <option value="soft">Soft</option>
                <option value="dramatic">Dramatic</option>
                <option value="flat">Flat</option>
            </select>
        </div>

        <script type="module">
            import * as THREE from 'three';
            import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
            import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
            import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

            // Parse URL parameters
            const url = new URL(location.href);
            const contentUrl = url.searchParams.get('content') || './mesh.glb';

            // Background color
            const bgParam = url.searchParams.get('bg') || '0.5,0.5,0.5';
            const [bgR, bgG, bgB] = bgParam.split(',').map(Number);

            const loadingDiv = document.getElementById('loading');

            // --- Renderer ---
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(new THREE.Color(bgR, bgG, bgB));
            renderer.toneMapping = THREE.NeutralToneMapping;
            document.body.appendChild(renderer.domElement);

            // --- Scene ---
            const scene = new THREE.Scene();

            // --- Environment map (critical for PBR materials) ---
            const pmremGenerator = new THREE.PMREMGenerator(renderer);
            pmremGenerator.compileEquirectangularShader();
            const envTexture = pmremGenerator.fromScene(new RoomEnvironment()).texture;
            scene.environment = envTexture;
            pmremGenerator.dispose();

            // --- Camera ---
            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 100);
            camera.position.set(0, 1, 3);

            // --- OrbitControls ---
            const controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.1;
            controls.screenSpacePanning = true;
            controls.minDistance = 0.1;
            controls.maxDistance = 50;

            // --- Lighting ---
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            const fillLight = new THREE.DirectionalLight(0xb0c0d0, 1.0);
            fillLight.position.set(-3, -2, -5);
            scene.add(fillLight);

            // --- Lighting presets ---
            const lightingPresets = {
                studio: {
                    exposure: 1.8,
                    ambient: { color: 0xffffff, intensity: 0.8 },
                    dir: { color: 0xffffff, intensity: 2.0, pos: [5, 10, 7] },
                    fill: { color: 0xb0c0d0, intensity: 1.0, pos: [-3, -2, -5] },
                    envIntensity: 1.0,
                },
                bright: {
                    exposure: 2.5,
                    ambient: { color: 0xffffff, intensity: 1.2 },
                    dir: { color: 0xffffff, intensity: 3.0, pos: [5, 10, 7] },
                    fill: { color: 0xc0d0e0, intensity: 1.5, pos: [-4, 0, -3] },
                    envIntensity: 1.5,
                },
                outdoor: {
                    exposure: 2.0,
                    ambient: { color: 0x8090c0, intensity: 0.6 },
                    dir: { color: 0xfff0d0, intensity: 3.0, pos: [8, 15, 4] },
                    fill: { color: 0x6080b0, intensity: 0.8, pos: [-5, 2, -8] },
                    envIntensity: 0.8,
                },
                soft: {
                    exposure: 2.0,
                    ambient: { color: 0xffffff, intensity: 1.5 },
                    dir: { color: 0xffffff, intensity: 0.8, pos: [3, 8, 5] },
                    fill: { color: 0xd0d0e0, intensity: 0.8, pos: [-3, 2, -3] },
                    envIntensity: 1.2,
                },
                dramatic: {
                    exposure: 1.5,
                    ambient: { color: 0x202030, intensity: 0.3 },
                    dir: { color: 0xffeedd, intensity: 4.0, pos: [10, 8, 2] },
                    fill: { color: 0x304060, intensity: 0.2, pos: [-5, -3, -8] },
                    envIntensity: 0.4,
                },
                flat: {
                    exposure: 2.2,
                    ambient: { color: 0xffffff, intensity: 2.0 },
                    dir: { color: 0xffffff, intensity: 0.5, pos: [0, 10, 0] },
                    fill: { color: 0xffffff, intensity: 0.5, pos: [0, -5, 0] },
                    envIntensity: 1.5,
                },
            };

            function applyLightingPreset(name) {
                const preset = lightingPresets[name];
                if (!preset) return;

                renderer.toneMappingExposure = preset.exposure;

                ambientLight.color.setHex(preset.ambient.color);
                ambientLight.intensity = preset.ambient.intensity;

                dirLight.color.setHex(preset.dir.color);
                dirLight.intensity = preset.dir.intensity;
                dirLight.position.set(...preset.dir.pos);

                fillLight.color.setHex(preset.fill.color);
                fillLight.intensity = preset.fill.intensity;
                fillLight.position.set(...preset.fill.pos);

                scene.environmentIntensity = preset.envIntensity;
            }

            // Apply default preset
            const presetParam = url.searchParams.get('lighting') || 'studio';
            const presetSelect = document.getElementById('lighting-preset');
            if (lightingPresets[presetParam]) {
                presetSelect.value = presetParam;
            }
            applyLightingPreset(presetSelect.value);

            presetSelect.addEventListener('change', (e) => {
                applyLightingPreset(e.target.value);
            });

            // --- Transparency sorting state ---
            const transparentMeshes = [];

            function setupTransparencySort(mesh) {
                const geom = mesh.geometry;
                const index = geom.index;
                if (!index) return;

                const positions = geom.attributes.position.array;
                const origIndices = new index.array.constructor(index.array);
                const numTris = index.count / 3;

                // Pre-compute centroids in local space
                const centroids = new Float32Array(numTris * 3);
                for (let t = 0; t < numTris; t++) {
                    const i0 = origIndices[t * 3] * 3;
                    const i1 = origIndices[t * 3 + 1] * 3;
                    const i2 = origIndices[t * 3 + 2] * 3;
                    centroids[t * 3]     = (positions[i0]     + positions[i1]     + positions[i2])     / 3;
                    centroids[t * 3 + 1] = (positions[i0 + 1] + positions[i1 + 1] + positions[i2 + 1]) / 3;
                    centroids[t * 3 + 2] = (positions[i0 + 2] + positions[i1 + 2] + positions[i2 + 2]) / 3;
                }

                const triOrder = new Uint32Array(numTris);
                const depths = new Float32Array(numTris);

                transparentMeshes.push({ mesh, origIndices, numTris, centroids, triOrder, depths });
                console.log(`Transparency sort: ${numTris} triangles on "${mesh.name}"`);
            }

            const _invWorld = new THREE.Matrix4();
            const _localCam = new THREE.Vector3();
            let lastCamX = null, lastCamY = null, lastCamZ = null;

            function sortTransparentMeshes() {
                if (transparentMeshes.length === 0) return;

                // Only re-sort if camera moved enough
                const cp = camera.position;
                if (lastCamX !== null) {
                    const dx = cp.x - lastCamX, dy = cp.y - lastCamY, dz = cp.z - lastCamZ;
                    if (dx * dx + dy * dy + dz * dz < 0.0001) return;
                }
                lastCamX = cp.x; lastCamY = cp.y; lastCamZ = cp.z;

                for (const tm of transparentMeshes) {
                    const { mesh, origIndices, numTris, centroids, triOrder, depths } = tm;

                    // Camera position in object local space
                    _invWorld.copy(mesh.matrixWorld).invert();
                    _localCam.copy(cp).applyMatrix4(_invWorld);
                    const cx = _localCam.x, cy = _localCam.y, cz = _localCam.z;

                    for (let t = 0; t < numTris; t++) {
                        const dx = centroids[t * 3]     - cx;
                        const dy = centroids[t * 3 + 1] - cy;
                        const dz = centroids[t * 3 + 2] - cz;
                        depths[t] = dx * dx + dy * dy + dz * dz;
                        triOrder[t] = t;
                    }

                    // Back-to-front
                    triOrder.sort((a, b) => depths[b] - depths[a]);

                    const dst = mesh.geometry.index.array;
                    for (let t = 0; t < numTris; t++) {
                        const src = triOrder[t] * 3;
                        dst[t * 3]     = origIndices[src];
                        dst[t * 3 + 1] = origIndices[src + 1];
                        dst[t * 3 + 2] = origIndices[src + 2];
                    }
                    mesh.geometry.index.needsUpdate = true;
                }
            }

            // --- Load GLB ---
            const loader = new GLTFLoader();
            loader.load(
                contentUrl,
                (gltf) => {
                    const model = gltf.scene;
                    scene.add(model);

                    // Compute bounding box and fit camera
                    const box = new THREE.Box3().setFromObject(model);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);

                    controls.target.copy(center);
                    camera.position.set(
                        center.x + maxDim * 1.2,
                        center.y + maxDim * 0.8,
                        center.z + maxDim * 1.2
                    );
                    controls.update();

                    // Near/far planes based on model size
                    camera.near = maxDim * 0.001;
                    camera.far = maxDim * 100;
                    camera.updateProjectionMatrix();

                    // Set up per-triangle sorting for BLEND materials
                    model.traverse((child) => {
                        if (child.isMesh && child.material && child.material.transparent) {
                            setupTransparencySort(child);
                        }
                    });

                    if (transparentMeshes.length > 0) {
                        sortTransparentMeshes();
                        console.log(`Transparency sorting active for ${transparentMeshes.length} mesh(es)`);
                    }

                    loadingDiv.style.display = 'none';
                    console.log('Model loaded:', contentUrl);
                },
                (progress) => {
                    if (progress.total > 0) {
                        const pct = Math.round(progress.loaded / progress.total * 100);
                        loadingDiv.textContent = `Loading mesh... ${pct}%`;
                    }
                },
                (error) => {
                    loadingDiv.textContent = 'Error loading mesh: ' + error.message;
                    console.error('Load error:', error);
                }
            );

            // --- Render loop ---
            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                sortTransparentMeshes();
                renderer.render(scene, camera);
            }
            animate();

            // --- Resize ---
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        </script>
    </body>
</html>
